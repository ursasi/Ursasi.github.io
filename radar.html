  tstat.textContent = `采集中 ${t} …`;
  const cutoff = new Date(Date.now() - 30*864e5).toISOString().slice(0,10);
  const url = `https://api.github.com/search/repositories?q=${
    encodeURIComponent(`topic:${t} stars:50..1500 pushed:>=${cutoff} fork:false archived:false`)
  }&sort=stars&order=desc&per_page=10`;
  try {
    const res = await fetch(url, {headers: {'Accept': 'application/vnd.github+json'}});
    if (!res.ok) throw new Error(res.status === 403 || res.status === 429 ? 'GitHub 限流, 一分钟后再试' : 'HTTP ' + res.status);
    const d = await res.json();
    liveRows = liveRows.filter(r => r.label !== t);
    (d.items || []).forEach(x => liveRows.push({
      cat: '自定义', label: t, name: x.full_name, url: x.html_url,
      desc: (x.description || '').slice(0, 100),
      stars: x.stargazers_count, forks: x.forks_count, delta: null,
      age_days: Math.round(days(x.created_at)), pushed_days: Math.round(days(x.pushed_at)),
      score: Math.round(x.stargazers_count / days(x.created_at) * 2 * 100) / 100,
      is_new: true }));
    const n = d.items ? d.items.length : 0;
    tstat.textContent = `${t}: ${n} 个候选`;
    const chip2 = [...tchips.children].find(c => c.textContent.startsWith(t));
    if (chip2) { chip2.classList.remove('busy');
      if (!chip2.querySelector('.n')) { const b = document.createElement('span');
        b.className = 'n'; b.textContent = n; chip2.appendChild(b); } }
    draw();
  } catch (e) { tstat.textContent = `${t}: ${e.message}`; }
}
function collectAll(){ topics.forEach((t, i) => setTimeout(() => collectTopic(t), i * 1200)); }
function dlTopics(){
  const txt = topics.map(t => `topic:${t} stars:50..1500`).join('\n') + '\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], {type: 'text/plain'}));
  a.download = 'topics.txt'; a.click();
}

// ---- 表格 ----
function draw() {
  let list = allRows().filter(r => (cat === '全部' || (cat === '🆕 新发现' ? r.is_new : r.cat === cat))
    && (!kw || r.name.toLowerCase().includes(kw) || (r.desc || '').toLowerCase().includes(kw) || r.label.includes(kw)));
  list.sort((a, b) => { const x = a[sortK], y = b[sortK];
    return (typeof x === 'string' ? x.localeCompare(y) : x - y) * (asc ? 1 : -1); });
  tb.innerHTML = list.length ? list.map((r, i) => `<tr style="--i:${Math.min(i, 25)}">
    <td><span class="score">${r.score}</span></td>
    <td><a href="${r.url}">${r.name}</a>${r.is_new ? '<span class="new"><i></i>NEW</span>' : ''}</td>
    <td><span class="tag t-${r.cat}"><i></i>${r.cat} · ${r.label}</span></td>
    <td class="num stars">⭐ ${r.stars}<span class="fork h-fork">${r.forks}f</span></td>
    <td class="num">${r.delta ? `<span class="up">↑+${r.delta}</span>` : '<span class="dim">·</span>'}</td>
    <td class="num act dim">${r.pushed_days}天前</td>
    <td class="desc">${r.desc || ''}</td></tr>`).join('')
    : `<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--dim)">没有匹配的项目</td></tr>`;
}
renderTopics();
if (topics.length) collectAll();
draw();
</script></body></html>
