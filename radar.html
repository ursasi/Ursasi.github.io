*{margin:0;padding:0;box-sizing:border-box}

.wrap{max-width:1440px;margin:0 auto;padding:52px 32px 72px}

.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
h1{font-size:32px;font-weight:700;letter-spacing:-.7px;line-height:1.15}
.lede{color:var(--muted);font-size:14.5px;margin-top:10px;max-width:640px}
.theme{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:999px;width:38px;height:38px;cursor:pointer;transition:all .2s;flex-shrink:0;display:grid;place-items:center}
.theme:hover{color:var(--fg);border-color:#3f3f46;transform:rotate(15deg)}
.theme:active{transform:scale(.94)}
.theme svg{width:16px;height:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:26px 0}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 20px}
.stat em{display:block;font-style:normal;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:500;margin-bottom:4px}
.stat b{display:block;font-size:24px;font-weight:650;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.stat b a{font-size:19px}
.stat span{font-size:12px;color:var(--dim)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chip{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:999px;padding:6px 14px;font-size:13px;cursor:pointer;user-select:none;transition:all .15s cubic-bezier(.4,0,.2,1);font-family:inherit}
.chip:hover{color:var(--fg);border-color:#3f3f46}
.chip:active{transform:scale(.97)}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg);font-weight:500}
.search{margin-left:auto;background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--fg);font-size:13px;padding:7px 13px;width:220px;outline:none;transition:border-color .15s,box-shadow .15s;font-family:inherit}
.search::placeholder{color:var(--dim)}
.search:focus{border-color:#3f3f46;box-shadow:0 0 0 3px var(--ring)}
.trow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;font-size:13px;color:var(--dim)}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{position:sticky;top:0;background:var(--card);text-align:left;color:var(--dim);font-weight:500;font-size:11px;letter-spacing:.07em;text-transform:uppercase;padding:12px 14px;border-bottom:1px solid var(--border);cursor:pointer;white-space:nowrap;transition:color .15s;z-index:2}
th:hover{color:var(--fg)}
th.sorted{color:var(--blue)}
th.sorted::after{content:" ↓";font-size:10px}
th.sorted.asc::after{content:" ↑"}
th.num,td.num{text-align:right}
.hide-d7 .h-d7,.hide-d7 .c-d7{display:none}
td{padding:11px 14px;border-bottom:1px solid var(--border-soft);vertical-align:top;line-height:1.5}
tbody tr{cursor:pointer;transition:background .15s;animation:fadeUp .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*14ms)}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
tbody tr:hover{background:var(--hover)}
tbody tr:last-child td{border-bottom:none}
.score{font-weight:650;font-variant-numeric:tabular-nums;font-size:14.5px}
.c-score{min-width:66px}
.c-rank{color:var(--dim);font-variant-numeric:tabular-nums;font-size:12px;width:46px}
.c-rank b{display:block;color:var(--fg);font-weight:600;font-size:13px}
.c-rank i{font-style:normal;font-size:10.5px}
.c-rank .rk-up{color:var(--green)}
.c-rank .rk-down{color:#fb7185}
.c-rank .rk-new{color:var(--blue)}
th.h-rank{width:34px;cursor:default}
.sbar{display:block;height:3px;border-radius:2px;background:var(--pill-bg);margin-top:5px;overflow:hidden;min-width:56px}
.sbar i{display:block;height:100%;background:var(--blue);border-radius:2px}
.stale{display:none;background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.35);color:#fb7185;border-radius:10px;padding:9px 14px;font-size:13px;margin-bottom:16px}

.ok{color:var(--green);font-size:11.5px;margin-left:6px}
a{color:var(--fg);text-decoration:none;font-weight:600;transition:color .15s}
a:hover{color:var(--blue)}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;font-size:11.5px;padding:2.5px 10px;white-space:nowrap;font-weight:500;color:var(--c);background:color-mix(in srgb,var(--c) 9%,transparent);border:1px solid color-mix(in srgb,var(--c) 26%,transparent)}
.tag i{width:5px;height:5px;border-radius:50%;background:currentColor}
.new{display:inline-block;margin-left:8px;color:var(--green);font-size:10px;letter-spacing:.08em;font-weight:600;border:1px solid color-mix(in srgb,var(--green) 35%,transparent);border-radius:4px;padding:1px 6px;vertical-align:2px}
.up{color:var(--green);font-variant-numeric:tabular-nums;font-weight:600}
.dim{color:var(--dim)}
.desc{color:var(--muted);font-size:12.5px;line-height:1.55;max-width:460px}
.stars{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
td.act{white-space:nowrap}
.mini{background:var(--card);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:6px 13px;font-size:12.5px;cursor:pointer;transition:all .15s;font-family:inherit}
.mini:hover{color:var(--fg);border-color:#3f3f46}
.mini:active{transform:scale(.97)}

.hl{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:13px 16px;min-width:0}
.hl em{display:block;font-style:normal;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:500;margin-bottom:5px}
.hl b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl span{display:block;font-size:12px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
tr.cursor{background:color-mix(in srgb,var(--blue) 7%,transparent);box-shadow:inset 2px 0 0 var(--blue)}
tr.detail td{padding:0 14px 14px;border-bottom:1px solid var(--border-soft)}
.det{display:grid;gap:11px;padding:14px 16px;background:color-mix(in srgb,var(--blue) 4%,transparent);border:1px solid var(--border);border-radius:10px}
.det-head{display:flex;align-items:center;gap:12px}
.det-grid{display:flex;flex-wrap:wrap;gap:5px 22px;font-size:13px;font-variant-numeric:tabular-nums}
.det-grid .lab,.det-head .lab{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-right:5px}
.det-desc{color:var(--muted);font-size:13px;max-width:760px}
.det-meta{color:var(--dim);font-size:12px}
.det-meta code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px}
.det-btn{display:inline-block;background:var(--fg);color:var(--bg);border-radius:8px;padding:6px 14px;font-size:13px;font-weight:500;width:fit-content}
.det-btn:hover{color:var(--bg);opacity:.88}
.spark-svg.big{width:240px;height:44px}

.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue);margin-right:7px;vertical-align:middle;flex-shrink:0}
tr.read .dot{background:transparent;border:1px solid var(--dim)}
tr.read .c-name a{color:var(--muted);font-weight:500}
.spark-svg{width:64px;height:18px;display:block;margin-left:auto}
.spark-svg polyline{fill:none;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}

.spark-down polyline{stroke:#fb7185}
.spark-flat polyline{stroke:var(--dim)}
.stars .fork{color:var(--dim);font-size:11.5px;margin-left:5px;font-weight:400}

 grid-template-columns:auto 1fr auto;grid-template-areas:"name name score" "tag tag stars" "spark spark spark" "d1 d24 d7" "desc desc desc" "act act act"}

.c-name{grid-area:name}.c-score{grid-area:score;justify-self:end}
.c-tag{grid-area:tag}.c-stars{grid-area:stars;justify-self:end}
.c-spark{grid-area:spark}.c-d1{grid-area:d1}.c-d24{grid-area:d24}.c-d7{grid-area:d7}
.c-desc{grid-area:desc;max-width:none}
.c-act{grid-area:act;font-size:12px}
.c-d1::before,.c-d24::before,.c-d7::before{display:block;font-size:10px;letter-spacing:.06em;color:var(--dim);text-transform:uppercase}

.highlights{grid-template-columns:1fr}

.det{border-radius:0 0 12px 12px;border-top:none}
.spark-svg.big{width:100%;height:40px}
.khint{display:none}
}

    .sort((a, b) => ((b.d1h) * 3 + (b.d24h ?? 0)) - ((a.d1h) * 3 + (a.d24h ?? 0)))[0];
  const riser = [...rows0].filter(r => (r.rank_delta ?? 0) > 0)
    .sort((a, b) => b.rank_delta - a.rank_delta)[0];
  const fresh = [...rows0].filter(r => r.rank_delta == null)
    .sort((a, b) => b.score - a.score)[0];
  document.getElementById('hl').innerHTML = [
    card('涨速最快', hot, hot ? `1h +${hot.d1h}${hot.d24h != null ? ` · 24h +${hot.d24h}` : ''} · ${hot.stars} stars` : ''),
    card('排名跃升', riser, riser ? `名次 ↑${riser.rank_delta} → 第 ${riser.rank} 名 · ${riser.score} 分` : ''),
    card('新进榜', fresh, fresh ? `${fresh.cat} · ${fresh.score} 分 · ${fresh.first_seen_days ?? '?'} 天前首次出现` : '')
  ].filter(Boolean).join('') || '<div class="hl"><em>今日看点</em><b>数据积累中</b><span>历史样本不足，下轮开始有结论</span></div>';
})();

// ---- 未读控件 ----
const unreadChip = document.getElementById('unreadChip');
unreadChip.onclick = () => { unreadOnly = !unreadOnly;
  unreadChip.classList.toggle('on', unreadOnly); draw(); };
document.getElementById('readAll').onclick = () => {
  rows0.forEach(r => markRead(r.name)); draw(); };

// ---- 数据新鲜度告警 ----
(() => {
  const mins = (Date.now() - new Date(DATA.ts)) / 60000;
  if (mins > 180) { const el = document.getElementById('stale');
    el.style.display = 'block';
    el.textContent = `数据已 ${Math.round(mins / 60)} 小时未更新，每小时采集可能中断`;
  }
})();

// ---- URL 状态(筛选可分享) ----
const KEYS = ['score', 'stars', 'd1h', 'd24h', 'd7d', 'pushed_days'];
function readHash(){
  const p = new URLSearchParams(location.hash.slice(1));
  const c = p.get('cat'); if (c) cat = c;
  labelF = p.get('label') || '';
  kw = p.get('kw') || '';
  const sk = p.get('sort'); if (KEYS.includes(sk)) sortK = sk;
  asc = p.get('asc') === '1';
  unreadOnly = p.get('unread') === '1';
}
function saveView(){ try { localStorage.setItem('radar_view', JSON.stringify(
  {cat, labelF, sortK, asc, unreadOnly})); } catch (e) {} }
function loadView(){
  try { const v = JSON.parse(localStorage.getItem('radar_view') || 'null'); if (!v) return;
    if (v.cat) cat = v.cat;
    labelF = v.labelF || '';
    if (KEYS.includes(v.sortK)) sortK = v.sortK;
    asc = !!v.asc; unreadOnly = !!v.unreadOnly;
  } catch (e) {}
}
function syncHash(){
  const p = new URLSearchParams();
  if (cat !== '全部') p.set('cat', cat);
  if (labelF) p.set('label', labelF);
  if (kw) p.set('kw', kw);
  if (sortK !== 'score') p.set('sort', sortK);
  if (asc) p.set('asc', '1');
  if (unreadOnly) p.set('unread', '1');
  const h = p.toString();
  history.replaceState(null, '', h ? '#' + h : location.pathname);
  saveView();
}
readHash();
if (!location.hash) loadView();      // 无 URL 参数时恢复上次视图
if (unreadOnly) unreadChip.classList.add('on');
document.getElementById('q').value = kw;

// 点击整行: 就地展开详情(点仓库名仍直接跳转)
tb.addEventListener('click', e => {
  if (e.target.closest('.detail')) return;
  const tr = e.target.closest('tr[data-name]');
  if (!tr) return;
  const n = tr.dataset.name, r = byName.get(n);
  markRead(n);
  tr.classList.add('read');                       // 就地变淡, 不重绘(避免行跳到页尾)
  const next = tr.nextElementSibling;
  if (next && next.classList.contains('detail')) { next.remove(); expanded = null; return; }
  tb.querySelectorAll('tr.detail').forEach(x => x.remove());
  if (r) { tr.insertAdjacentHTML('afterend', detailRow(r)); expanded = n; }
});

// 键盘导航: j/k 移动 · Enter 打开 · x 已读 · / 搜索 · Esc 清空
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA') {
    if (e.key === 'Escape') { t.value = ''; kw = ''; draw(); t.blur(); }
    return;
  }
  if (e.key === '/') { e.preventDefault(); document.getElementById('q').focus(); return; }
  if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); moveCur(1); }
  else if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); moveCur(-1); }
  else if (e.key === 'Enter' && view[cur]) { e.preventDefault();
    markRead(view[cur].name); window.open(view[cur].url, '_blank', 'noopener'); draw(); }
  else if (e.key === 'x' && view[cur]) { e.preventDefault();
    markRead(view[cur].name); draw(); }
});
function moveCur(d) {
  if (!view.length) return;
  cur = Math.max(0, Math.min(view.length - 1, cur + d));
  [...tb.querySelectorAll('tr[data-name]')].forEach((tr, i) => tr.classList.toggle('cursor', i === cur));
  const el = tb.querySelector('tr.cursor');
  if (el) el.scrollIntoView({ block: 'nearest' });
}

// ---- 分类 chips ----
const cats = ['全部', '🆕 新发现', ...new Set(rows0.map(r => r.cat))];
// 自定义 chip 由数据驱动 (topics.txt 的话题也在 rows 里)
const chips = document.getElementById('chips');
function renderChips(){
  if (!cats.includes(cat)) cat = '全部';
  chips.innerHTML = '';
  cats.forEach(c => { const b = document.createElement('button');
    b.className = 'chip' + (c === cat ? ' on' : ''); b.textContent = c;
    b.onclick = () => { cat = c; labelF = ''; renderChips(); renderLabels(); draw(); };
    chips.appendChild(b); });
}
const lrow = document.getElementById('lrow'), lchips = document.getElementById('lchips');
function renderLabels(){
  const inCat = cat === '全部' || cat === '🆕 新发现' ? [] :
    [...new Set(rows0.filter(r => r.cat === cat).map(r => r.label))];
  lrow.style.display = inCat.length ? '' : 'none';
  lchips.innerHTML = '';
  ['全部', ...inCat].forEach(l => { const b = document.createElement('button');
    b.className = 'chip' + ((l === '全部' && !labelF) || l === labelF ? ' on' : '');
    b.style.padding = '4px 12px'; b.style.fontSize = '12px'; b.textContent = l;
    b.onclick = () => { labelF = l === '全部' ? '' : l; renderLabels(); draw(); };
    lchips.appendChild(b); });
}
renderChips();
document.getElementById('q').oninput = e => { kw = e.target.value.toLowerCase(); draw(); };
const theads = [...document.querySelectorAll('th[data-k]')];
theads.forEach(th => th.onclick = () => {
  asc = sortK === th.dataset.k ? !asc : false; sortK = th.dataset.k; draw(); });

// ---- 表格 ----
function draw() {
  theads.forEach(t => { t.classList.toggle('sorted', t.dataset.k === sortK);
    t.classList.toggle('asc', t.dataset.k === sortK && asc); });
  let list = rows0.filter(r => (cat === '全部' || (cat === '🆕 新发现' ? r.is_new : r.cat === cat))
    && (!labelF || r.label === labelF)
    && (!unreadOnly || !isRead(r.name))
    && (!kw || r.name.toLowerCase().includes(kw) || (r.desc || '').toLowerCase().includes(kw) || r.label.includes(kw)));
  list.sort((a, b) => {
    const x = a[sortK], y = b[sortK];
    return (typeof x === 'string' ? x.localeCompare(y) : (x ?? -1) - (y ?? -1)) * (asc ? 1 : -1); });
  const fmt = v => (v === null || v === undefined)
    ? '<span class="dim" title="历史样本积累中, 日涨需24h、周涨需7天">—</span>'
    : (v ? `<span class="up">↑+${v}</span>` : '<span class="dim" title="无变化">·</span>');
  view = list;
  if (cur >= view.length) cur = view.length - 1;
  document.querySelector('.card').classList.toggle('hide-d7', !list.some(r => r.d7d != null));
  tb.innerHTML = list.length ? list.map((r, i) => `<tr class="${isRead(r.name) ? 'read' : ''}" data-name="${r.name}" data-url="${r.url}" style="--i:${Math.min(i, 25)}">
    <td class="c-rank" title="${r.rank_delta == null ? '未进入昨日榜单' : '名次较昨日 ' + (r.rank_delta > 0 ? '+' : '') + r.rank_delta + ' 位'}"><b>${r.rank || i + 1}</b><i class="${r.rank_delta > 0 ? 'rk-up' : r.rank_delta < 0 ? 'rk-down' : 'rk-new'}">${
      r.rank_delta == null ? '新' : r.rank_delta > 0 ? '▲' + r.rank_delta : r.rank_delta < 0 ? '▼' + -r.rank_delta : '—'}</i></td>
    <td class="c-score"><span class="score">${r.score}</span><span class="sbar"><i style="width:${Math.round(r.score / maxScore * 100)}%"></i></span></td>
    <td class="c-name"><span class="dot"></span><a href="${r.url}">${esc(r.name)}</a>${r.is_new ? '<span class="new">NEW</span>' : ''}</td>
    <td class="c-tag"><span class="tag" style="--c:var(--c-${r.cat})" title="GitHub 查询: ${esc(r.query)}"><i></i>${r.cat} · ${r.label}</span></td>
    <td class="num stars c-stars">${r.stars}<span class="fork h-fork">${r.forks}f</span></td>
    <td class="num h-spark c-spark">${sparkSvg(r)}</td>
    <td class="num c-d1">${fmt(r.d1h)}</td>
    <td class="num c-d24">${fmt(r.d24h)}</td>
    <td class="num c-d7">${fmt(r.d7d)}</td>
    <td class="num act dim c-act">${r.pushed_days}天前</td>
    <td class="desc c-desc" title="${esc(r.desc)}">${esc(clip(r.desc))}</td></tr>` + (expanded === r.name ? detailRow(r) : '')).join('')
    : `<tr><td colspan="11" style="text-align:center;padding:32px;color:var(--dim)">没有匹配的项目</td></tr>`;
  syncHash();
}
renderLabels();
draw();
</script></body></html>
