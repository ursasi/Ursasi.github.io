  <a class="det-btn" href="${r.url}" target="_blank" rel="noopener">打开 GitHub →</a>
</div></td></tr>`;

// ---- 主题 ----
const themeBtn = document.getElementById('themeBtn');
function setTheme(t){ document.documentElement.dataset.theme = t;
  localStorage.setItem('radar_theme', t);
  themeBtn.querySelector('.ic-sun').style.display = t === 'light' ? 'none' : '';
  themeBtn.querySelector('.ic-moon').style.display = t === 'light' ? '' : 'none'; }
setTheme(localStorage.getItem('radar_theme') || 'dark');
themeBtn.onclick = () => setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');
document.getElementById('upd').textContent = DATA.date + ' 更新';

// ---- 统计卡 ----
const newN = rows0.filter(r => r.is_new).length;
document.querySelector('.stats').innerHTML = `
  <div class="stat"><em>scanned</em><b>${DATA.total}</b><span>本轮扫描候选</span></div>
  <div class="stat"><em>new</em><b style="color:var(--green)">${newN}</b><span>新发现</span></div>
  <div class="stat"><em>top score</em><b><a href="${rows0[0].url}">${(rows0[0].name.split('/')[1] || rows0[0].name)}</a></b><span>${rows0[0].score} 分 · ${rows0[0].stars} stars</span></div>`;

// ---- 今日看点: 三张结论卡 ----
(() => {
  const short = r => r.name.split('/')[1] || r.name;
  const card = (lab, r, metric) => r ? `<div class="hl"><em>${lab}</em><b><a href="${r.url}">${esc(short(r))}</a></b><span>${metric}</span></div>` : '';
  const hot = [...rows0].filter(r => (r.d1h ?? 0) > 0)
    .sort((a, b) => ((b.d1h) * 3 + (b.d24h ?? 0)) - ((a.d1h) * 3 + (a.d24h ?? 0)))[0];
  const riser = [...rows0].filter(r => (r.rank_delta ?? 0) > 0)
    .sort((a, b) => b.rank_delta - a.rank_delta)[0];
  const fresh = [...rows0].filter(r => r.rank_delta == null)
    .sort((a, b) => b.score - a.score)[0];
  document.getElementById('hl').innerHTML = [
    card('涨速最快', hot, hot ? `1h +${hot.d1h}${hot.d24h != null ? ` · 24h +${hot.d24h}` : ''} · ${hot.stars} stars` : ''),
    card('排名跃升', riser, riser ? `名次 ↑${riser.rank_delta} → 第 ${riser.rank} 名 · ${riser.score} 分` : ''),
    card('新进榜', fresh, fresh ? `${fresh.cat} · ${fresh.score} 分 · ${fresh.first_seen_days ?? '?'} 天前首次出现` : '')
  ].filter(Boolean).join('') || '<div class="hl"><em>今日看点</em><b>数据积累中</b><span>历史样本不足，下轮开始有结论</span></div>';
})();

// ---- 未读控件 ----
const unreadChip = document.getElementById('unreadChip');
unreadChip.onclick = () => { unreadOnly = !unreadOnly;
  unreadChip.classList.toggle('on', unreadOnly); draw(); };
document.getElementById('readAll').onclick = () => {
  rows0.forEach(r => markRead(r.name)); draw(); };

// ---- 数据新鲜度告警 ----
(() => {
  const mins = (Date.now() - new Date(DATA.ts)) / 60000;
  if (mins > 180) { const el = document.getElementById('stale');
    el.style.display = 'block';
    el.textContent = `数据已 ${Math.round(mins / 60)} 小时未更新，每小时采集可能中断`;
  }
})();

// ---- URL 状态(筛选可分享) ----
const KEYS = ['score', 'stars', 'd1h', 'd24h', 'd7d', 'pushed_days'];
function readHash(){
  const p = new URLSearchParams(location.hash.slice(1));
  const c = p.get('cat'); if (c) cat = c;
  labelF = p.get('label') || '';
  kw = p.get('kw') || '';
  const sk = p.get('sort'); if (KEYS.includes(sk)) sortK = sk;
  asc = p.get('asc') === '1';
  unreadOnly = p.get('unread') === '1';
}
function saveView(){ try { localStorage.setItem('radar_view', JSON.stringify(
  {cat, labelF, sortK, asc, unreadOnly})); } catch (e) {} }
function loadView(){
  try { const v = JSON.parse(localStorage.getItem('radar_view') || 'null'); if (!v) return;
    if (v.cat) cat = v.cat;
    labelF = v.labelF || '';
    if (KEYS.includes(v.sortK)) sortK = v.sortK;
    asc = !!v.asc; unreadOnly = !!v.unreadOnly;
  } catch (e) {}
}
function syncHash(){
  const p = new URLSearchParams();
  if (cat !== '全部') p.set('cat', cat);
  if (labelF) p.set('label', labelF);
  if (kw) p.set('kw', kw);
  if (sortK !== 'score') p.set('sort', sortK);
  if (asc) p.set('asc', '1');
  if (unreadOnly) p.set('unread', '1');
  const h = p.toString();
  history.replaceState(null, '', h ? '#' + h : location.pathname);
  saveView();
}
readHash();
if (!location.hash) loadView();      // 无 URL 参数时恢复上次视图
if (unreadOnly) unreadChip.classList.add('on');
document.getElementById('q').value = kw;

// 点击整行: 就地展开详情(点仓库名仍直接跳转)
tb.addEventListener('click', e => {
  if (e.target.closest('.detail')) return;
  const tr = e.target.closest('tr[data-name]');
  if (!tr) return;
  const n = tr.dataset.name, r = byName.get(n);
  markRead(n);
  tr.classList.add('read');                       // 就地变淡, 不重绘(避免行跳到页尾)
  const next = tr.nextElementSibling;
  if (next && next.classList.contains('detail')) { next.remove(); expanded = null; return; }
  tb.querySelectorAll('tr.detail').forEach(x => x.remove());
  if (r) { tr.insertAdjacentHTML('afterend', detailRow(r)); expanded = n; }
});

// 键盘导航: j/k 移动 · Enter 打开 · x 已读 · / 搜索 · Esc 清空
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA') {
    if (e.key === 'Escape') { t.value = ''; kw = ''; draw(); t.blur(); }
    return;
  }
  if (e.key === '/') { e.preventDefault(); document.getElementById('q').focus(); return; }
  if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); moveCur(1); }
  else if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); moveCur(-1); }
  else if (e.key === 'Enter' && view[cur]) { e.preventDefault();
    markRead(view[cur].name); window.open(view[cur].url, '_blank', 'noopener'); draw(); }
  else if (e.key === 'x' && view[cur]) { e.preventDefault();
    markRead(view[cur].name); draw(); }
});
function moveCur(d) {
  if (!view.length) return;
  cur = Math.max(0, Math.min(view.length - 1, cur + d));
  [...tb.querySelectorAll('tr[data-name]')].forEach((tr, i) => tr.classList.toggle('cursor', i === cur));
  const el = tb.querySelector('tr.cursor');
  if (el) el.scrollIntoView({ block: 'nearest' });
}

// ---- 分类 chips ----
const cats = ['全部', '🆕 新发现', ...new Set(rows0.map(r => r.cat))];
// 自定义 chip 由数据驱动 (topics.txt 的话题也在 rows 里)
const chips = document.getElementById('chips');
function renderChips(){
  if (!cats.includes(cat)) cat = '全部';
  chips.innerHTML = '';
  cats.forEach(c => { const b = document.createElement('button');
    b.className = 'chip' + (c === cat ? ' on' : ''); b.textContent = c;
    b.onclick = () => { cat = c; labelF = ''; renderChips(); renderLabels(); draw(); };
    chips.appendChild(b); });
}
const lrow = document.getElementById('lrow'), lchips = document.getElementById('lchips');
function renderLabels(){
  const inCat = cat === '全部' || cat === '🆕 新发现' ? [] :
    [...new Set(rows0.filter(r => r.cat === cat).map(r => r.label))];
  lrow.style.display = inCat.length ? '' : 'none';
  lchips.innerHTML = '';
  ['全部', ...inCat].forEach(l => { const b = document.createElement('button');
    b.className = 'chip' + ((l === '全部' && !labelF) || l === labelF ? ' on' : '');
    b.style.padding = '4px 12px'; b.style.fontSize = '12px'; b.textContent = l;
    b.onclick = () => { labelF = l === '全部' ? '' : l; renderLabels(); draw(); };
    lchips.appendChild(b); });
}
renderChips();
document.getElementById('q').oninput = e => { kw = e.target.value.toLowerCase(); draw(); };
const theads = [...document.querySelectorAll('th[data-k]')];
theads.forEach(th => th.onclick = () => {
  asc = sortK === th.dataset.k ? !asc : false; sortK = th.dataset.k; draw(); });

// ---- 表格 ----
function draw() {
  theads.forEach(t => { t.classList.toggle('sorted', t.dataset.k === sortK);
    t.classList.toggle('asc', t.dataset.k === sortK && asc); });
  let list = rows0.filter(r => (cat === '全部' || (cat === '🆕 新发现' ? r.is_new : r.cat === cat))
    && (!labelF || r.label === labelF)
    && (!unreadOnly || !isRead(r.name))
    && (!kw || r.name.toLowerCase().includes(kw) || (r.desc || '').toLowerCase().includes(kw) || r.label.includes(kw)));
  list.sort((a, b) => {
    const x = a[sortK], y = b[sortK];
    return (typeof x === 'string' ? x.localeCompare(y) : (x ?? -1) - (y ?? -1)) * (asc ? 1 : -1); });
  const fmt = v => (v === null || v === undefined)
    ? '<span class="dim" title="历史样本积累中, 日涨需24h、周涨需7天">—</span>'
    : (v ? `<span class="up">↑+${v}</span>` : '<span class="dim" title="无变化">·</span>');
  view = list;
  if (cur >= view.length) cur = view.length - 1;
  document.querySelector('.card').classList.toggle('hide-d7', !list.some(r => r.d7d != null));
  tb.innerHTML = list.length ? list.map((r, i) => `<tr class="${isRead(r.name) ? 'read' : ''}" data-name="${r.name}" data-url="${r.url}" style="--i:${Math.min(i, 25)}">
    <td class="c-rank"><b>${r.rank || i + 1}</b><i class="${r.rank_delta > 0 ? 'rk-up' : r.rank_delta < 0 ? 'rk-down' : 'rk-new'}">${
      r.rank_delta == null ? '新' : r.rank_delta > 0 ? '↑' + r.rank_delta : r.rank_delta < 0 ? '↓' + -r.rank_delta : '—'}</i></td>
    <td class="c-score"><span class="score">${r.score}</span><span class="sbar"><i style="width:${Math.round(r.score / maxScore * 100)}%"></i></span></td>
    <td class="c-name"><span class="dot"></span><a href="${r.url}">${esc(r.name)}</a>${r.is_new ? '<span class="new">NEW</span>' : ''}</td>
    <td class="c-tag"><span class="tag" style="--c:var(--c-${r.cat})" title="GitHub 查询: ${esc(r.query)}"><i></i>${r.cat} · ${r.label}</span></td>
    <td class="num stars c-stars">${r.stars}<span class="fork h-fork">${r.forks}f</span></td>
    <td class="num h-spark c-spark">${sparkSvg(r)}</td>
    <td class="num c-d1">${fmt(r.d1h)}</td>
    <td class="num c-d24">${fmt(r.d24h)}</td>
    <td class="num c-d7">${fmt(r.d7d)}</td>
    <td class="num act dim c-act">${r.pushed_days}天前</td>
    <td class="desc c-desc" title="${esc(r.desc)}">${esc(clip(r.desc))}</td></tr>` + (expanded === r.name ? detailRow(r) : '')).join('')
    : `<tr><td colspan="11" style="text-align:center;padding:32px;color:var(--dim)">没有匹配的项目</td></tr>`;
  syncHash();
}
renderLabels();
draw();
</script></body></html>
