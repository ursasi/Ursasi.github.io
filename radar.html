const rows0 = DATA.rows;
let topics = JSON.parse(localStorage.getItem('radar_topics') || '[]');
let liveRows = [];
let kw = '', cat = '全部', sortK = 'score', asc = false;

const days = iso => Math.max(1, (Date.now() - new Date(iso)) / 864e5);
const allRows = () => rows0.concat(liveRows);

// ---- 主题 ----
const themeBtn = document.getElementById('themeBtn');
function setTheme(t){ document.documentElement.dataset.theme = t;
  localStorage.setItem('radar_theme', t);
  themeBtn.querySelector('.ic-sun').style.display = t === 'light' ? 'none' : '';
  themeBtn.querySelector('.ic-moon').style.display = t === 'light' ? '' : 'none'; }
setTheme(localStorage.getItem('radar_theme') || 'dark');
themeBtn.onclick = () => setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');

// ---- 统计卡 ----
const newN = rows0.filter(r => r.is_new).length;
document.querySelector('.stats').innerHTML = `
  <div class="stat"><em>scanned</em><b>${DATA.total}</b><span>本轮扫描候选</span></div>
  <div class="stat"><em>new</em><b style="color:var(--green)">${newN}</b><span>新发现</span></div>
  <div class="stat"><em>top score</em><b><a href="${rows0[0].url}">${(rows0[0].name.split('/')[1] || rows0[0].name)}</a></b><span>${rows0[0].score} 分 · ${rows0[0].stars} stars</span></div>`;

// ---- 分类 chips ----
const cats = ['全部', '🆕 新发现', ...new Set(rows0.map(r => r.cat))];
if (topics.length && !cats.includes('自定义')) cats.push('自定义');
const chips = document.getElementById('chips');
function renderChips(){
  chips.innerHTML = '';
  cats.forEach(c => { const b = document.createElement('button');
    b.className = 'chip' + (c === cat ? ' on' : ''); b.textContent = c;
    b.onclick = () => { cat = c; renderChips(); draw(); }; chips.appendChild(b); });
}
renderChips();
document.getElementById('q').oninput = e => { kw = e.target.value.toLowerCase(); draw(); };
const theads = [...document.querySelectorAll('th[data-k]')];
theads.forEach(th => th.onclick = () => {
  asc = sortK === th.dataset.k ? !asc : false; sortK = th.dataset.k; draw(); });

// ---- 自选话题 ----
const tchips = document.getElementById('tchips'), tstat = document.getElementById('tstat');
function saveTopics(){ localStorage.setItem('radar_topics', JSON.stringify(topics)); }
function renderTopics(){
  tchips.innerHTML = '';
  topics.forEach(t => { const s = document.createElement('span');
    s.className = 'tchip'; s.innerHTML = `${t} <button title="移除" onclick="rmTopic('${t}')">×</button>`;
    tchips.appendChild(s); });
}
function addTopic(){
  const inp = document.getElementById('nt');
  const t = inp.value.trim().replace(/^topic:/, '');
  if (!t) return;
  if (!topics.includes(t)) { topics.push(t); saveTopics(); renderTopics(); collectTopic(t); }
  inp.value = '';
}
function rmTopic(t){
  topics = topics.filter(x => x !== t);
  liveRows = liveRows.filter(r => r.label !== t);
  saveTopics(); renderTopics(); draw();
}
async function collectTopic(t){
  tstat.textContent = `采集中 ${t} …`;
  const cutoff = new Date(Date.now() - 30*864e5).toISOString().slice(0,10);
  const url = `https://api.github.com/search/repositories?q=${
    encodeURIComponent(`topic:${t} stars:50..1500 pushed:>=${cutoff} fork:false archived:false`)
  }&sort=stars&order=desc&per_page=10`;
  try {
    const res = await fetch(url, {headers: {'Accept': 'application/vnd.github+json'}});
    if (!res.ok) throw new Error(res.status === 403 || res.status === 429 ? 'GitHub 限流, 一分钟后再试' : 'HTTP ' + res.status);
    const d = await res.json();
    liveRows = liveRows.filter(r => r.label !== t);
    (d.items || []).forEach(x => liveRows.push({
      cat: '自定义', label: t, name: x.full_name, url: x.html_url,
      desc: (x.description || '').slice(0, 140),
      stars: x.stargazers_count, forks: x.forks_count,
      d1h: null, d24h: null, d7d: null,
      age_days: Math.round(days(x.created_at)), pushed_days: Math.round(days(x.pushed_at)),
      score: Math.round(x.stargazers_count / days(x.created_at) * 2 * 100) / 100,
      is_new: true }));
    tstat.textContent = `${t}: ${(d.items || []).length} 个候选`;
    if (!cats.includes('自定义')) { cats.push('自定义'); renderChips(); }
    draw();
  } catch (e) { tstat.textContent = `${t}: ${e.message}`; }
}
function collectAll(){ topics.forEach((t, i) => setTimeout(() => collectTopic(t), i * 1200)); }
function dlTopics(){
  const txt = topics.map(t => `topic:${t} stars:50..1500`).join('\n') + '\n';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], {type: 'text/plain'}));
  a.download = 'topics.txt'; a.click();
}

// ---- 表格 ----
function draw() {
  theads.forEach(t => { t.classList.toggle('sorted', t.dataset.k === sortK);
    t.classList.toggle('asc', t.dataset.k === sortK && asc); });
  let list = allRows().filter(r => (cat === '全部' || (cat === '🆕 新发现' ? r.is_new : r.cat === cat))
    && (!kw || r.name.toLowerCase().includes(kw) || (r.desc || '').toLowerCase().includes(kw) || r.label.includes(kw)));
  list.sort((a, b) => { const x = a[sortK], y = b[sortK];
    return (typeof x === 'string' ? x.localeCompare(y) : (x ?? -1) - (y ?? -1)) * (asc ? 1 : -1); });
  const fmt = v => v ? `<span class="up">↑+${v}</span>` : '<span class="dim">·</span>';
  tb.innerHTML = list.length ? list.map((r, i) => `<tr style="--i:${Math.min(i, 25)}">
    <td><span class="score">${r.score}</span></td>
    <td><a href="${r.url}">${r.name}</a>${r.is_new ? '<span class="new">NEW</span>' : ''}</td>
    <td><span class="tag" style="--c:var(--c-${r.cat})"><i></i>${r.cat} · ${r.label}</span></td>
    <td class="num stars">${r.stars}<span class="fork h-fork">${r.forks}f</span></td>
    <td class="num d1">${fmt(r.d1h)}</td>
    <td class="num">${fmt(r.d24h)}</td>
    <td class="num d7">${fmt(r.d7d)}</td>
    <td class="num act dim">${r.pushed_days}天前</td>
    <td class="desc">${r.desc || ''}</td></tr>`).join('')
    : `<tr><td colspan="9" style="text-align:center;padding:32px;color:var(--dim)">没有匹配的项目</td></tr>`;
}
renderTopics();
if (topics.length) collectAll();
draw();
</script></body></html>
