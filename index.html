<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f7f9">
<meta name="description" content="Ursasi 的个人主页。">
<title>Ursasi</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/geist@5/index.min.css">
<style>
:root{--bg:#f6f7f9;--panel:#fff;--fg:#202a29;--muted:#606e6a;--line:#e5eae7;--accent:#13795b;--hover:#f3f8f5;color-scheme:light}
html[data-theme=dark]{--bg:#151b19;--panel:#1c2421;--fg:#e5ece8;--muted:#a8b9b0;--line:#303d36;--accent:#8ed7b5;--hover:#26372e;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100dvh;background:var(--bg);color:var(--fg);font:15px/1.65 "Geist Variable",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}a,button{transition:color .18s,background .18s}a:hover,button:hover{color:var(--accent)}a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:5px}
.wrap{max-width:1040px;margin:auto;padding:0 36px}nav{display:flex;align-items:center;gap:24px;min-height:86px;border-bottom:1px solid var(--line)}.home{font-weight:650;letter-spacing:-.03em}.links{margin-left:auto;display:flex;align-items:center;gap:20px;color:var(--muted)}.icon{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--muted);cursor:pointer}.icon:hover{background:var(--hover)}.icon svg{width:18px;height:18px}.theme svg{fill:none;stroke:currentColor;stroke-width:1.6}main{padding-top:100px}h1{font-size:clamp(48px,8vw,80px);font-weight:600;letter-spacing:-.055em;line-height:1.1}.skip{position:fixed;top:-80px;left:16px;padding:12px;background:var(--panel)}.skip:focus{top:10px}.ic-sun{display:none}html[data-theme=dark] .ic-sun{display:block}html[data-theme=dark] .ic-moon{display:none}@media(max-width:600px){.wrap{padding:0 24px}nav{min-height:76px}.links{gap:12px}main{padding-top:72px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<script>
try{const theme=localStorage.getItem('radar_theme');if(theme==='dark')document.documentElement.dataset.theme='dark';}catch{}
</script>
</head>
<body>
<a class="skip" href="#main">跳到内容</a>
<div class="wrap">
<nav aria-label="主导航"><a class="home" href="./" aria-current="page">Ursasi</a><div class="links"><a href="radar.html">源望 ↗</a><a class="icon" href="https://github.com/ursasi" target="_blank" rel="noopener noreferrer" aria-label="Ursasi 的 GitHub 主页" title="GitHub"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .297a12 12 0 0 0-3.793 23.385c.6.111.82-.261.82-.577v-2.234c-3.338.726-4.043-1.416-4.043-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.09-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.108-.775.418-1.305.762-1.605-2.665-.303-5.467-1.334-5.467-5.931 0-1.31.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23a11.52 11.52 0 0 1 6.006 0c2.291-1.552 3.297-1.23 3.297-1.23.654 1.652.243 2.873.12 3.176.769.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.625-5.479 5.922.43.372.823 1.102.823 2.222v3.293c0 .319.216.694.825.576A12 12 0 0 0 12 .297Z"/></svg></a><button class="icon theme" id="themeBtn" type="button" aria-label="切换主题" title="切换明暗主题"><svg class="ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg><svg class="ic-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button></div></nav>
<main id="main"><h1>Ursasi</h1></main>
</div>
<script>
function setTheme(theme){document.documentElement.dataset.theme=theme;document.querySelector('meta[name="theme-color"]').content=theme==='dark'?'#151b19':'#f6f7f9';try{localStorage.setItem('radar_theme',theme);}catch{}}
setTheme(document.documentElement.dataset.theme);
document.getElementById('themeBtn').onclick=()=>setTheme(document.documentElement.dataset.theme==='light'?'dark':'light');
</script>
</body>
</html>
