const rows0 = DATA.rows;
let kw = '', cat = '全部', labelF = '', sortK = 'score', asc = false;

const days = iso => Math.max(1, (Date.now() - new Date(iso)) / 864e5);

// ---- 主题 ----
const themeBtn = document.getElementById('themeBtn');
function setTheme(t){ document.documentElement.dataset.theme = t;
  localStorage.setItem('radar_theme', t);
  themeBtn.querySelector('.ic-sun').style.display = t === 'light' ? 'none' : '';
  themeBtn.querySelector('.ic-moon').style.display = t === 'light' ? '' : 'none'; }
setTheme(localStorage.getItem('radar_theme') || 'dark');
themeBtn.onclick = () => setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');

// ---- 统计卡 ----
const newN = rows0.filter(r => r.is_new).length;
document.querySelector('.stats').innerHTML = `
  <div class="stat"><em>scanned</em><b>${DATA.total}</b><span>本轮扫描候选</span></div>
  <div class="stat"><em>new</em><b style="color:var(--green)">${newN}</b><span>新发现</span></div>
  <div class="stat"><em>top score</em><b><a href="${rows0[0].url}">${(rows0[0].name.split('/')[1] || rows0[0].name)}</a></b><span>${rows0[0].score} 分 · ${rows0[0].stars} stars</span></div>`;

// ---- 分类 chips ----
const cats = ['全部', '🆕 新发现', ...new Set(rows0.map(r => r.cat))];
// 自定义 chip 由数据驱动 (topics.txt 的话题也在 rows 里)
const chips = document.getElementById('chips');
function renderChips(){
  chips.innerHTML = '';
  cats.forEach(c => { const b = document.createElement('button');
    b.className = 'chip' + (c === cat ? ' on' : ''); b.textContent = c;
    b.onclick = () => { cat = c; labelF = ''; renderChips(); renderLabels(); draw(); };
    chips.appendChild(b); });
}
const lrow = document.getElementById('lrow'), lchips = document.getElementById('lchips');
function renderLabels(){
  const inCat = cat === '全部' || cat === '🆕 新发现' ? [] :
    [...new Set(rows0.filter(r => r.cat === cat).map(r => r.label))];
  lrow.style.display = inCat.length ? '' : 'none';
  lchips.innerHTML = '';
  ['全部', ...inCat].forEach(l => { const b = document.createElement('button');
    b.className = 'chip' + ((l === '全部' && !labelF) || l === labelF ? ' on' : '');
    b.style.padding = '4px 12px'; b.style.fontSize = '12px'; b.textContent = l;
    b.onclick = () => { labelF = l === '全部' ? '' : l; renderLabels(); draw(); };
    lchips.appendChild(b); });
}
renderChips();
document.getElementById('q').oninput = e => { kw = e.target.value.toLowerCase(); draw(); };
const theads = [...document.querySelectorAll('th[data-k]')];
theads.forEach(th => th.onclick = () => {
  asc = sortK === th.dataset.k ? !asc : false; sortK = th.dataset.k; draw(); });

// ---- 表格 ----
function draw() {
  theads.forEach(t => { t.classList.toggle('sorted', t.dataset.k === sortK);
    t.classList.toggle('asc', t.dataset.k === sortK && asc); });
  let list = rows0.filter(r => (cat === '全部' || (cat === '🆕 新发现' ? r.is_new : r.cat === cat))
    && (!labelF || r.label === labelF)
    && (!kw || r.name.toLowerCase().includes(kw) || (r.desc || '').toLowerCase().includes(kw) || r.label.includes(kw)));
  list.sort((a, b) => { const x = a[sortK], y = b[sortK];
    return (typeof x === 'string' ? x.localeCompare(y) : (x ?? -1) - (y ?? -1)) * (asc ? 1 : -1); });
  const fmt = v => v ? `<span class="up">↑+${v}</span>` : '<span class="dim">·</span>';
  tb.innerHTML = list.length ? list.map((r, i) => `<tr style="--i:${Math.min(i, 25)}">
    <td><span class="score">${r.score}</span></td>
    <td><a href="${r.url}">${r.name}</a>${r.is_new ? '<span class="new">NEW</span>' : ''}</td>
    <td><span class="tag" style="--c:var(--c-${r.cat})"><i></i>${r.cat} · ${r.label}</span></td>
    <td class="num stars">${r.stars}<span class="fork h-fork">${r.forks}f</span></td>
    <td class="num d1">${fmt(r.d1h)}</td>
    <td class="num">${fmt(r.d24h)}</td>
    <td class="num d7">${fmt(r.d7d)}</td>
    <td class="num act dim">${r.pushed_days}天前</td>
    <td class="desc">${r.desc || ''}</td></tr>`).join('')
    : `<tr><td colspan="9" style="text-align:center;padding:32px;color:var(--dim)">没有匹配的项目</td></tr>`;
}
renderLabels();
draw();
