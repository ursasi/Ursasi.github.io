const isRead = n => !!seen[n];
function markRead(n){ seen[n] = Date.now();
  try { localStorage.setItem('radar_seen', JSON.stringify(seen)); } catch (e) {} }

const days = iso => Math.max(1, (Date.now() - new Date(iso)) / 864e5);

  const tr = e.target.closest('tr');

  markRead(tr.dataset.name);

  if (e.target.tagName !== 'A') window.open(tr.dataset.url, '_blank', 'noopener');
});

const cats = ['全部', '🆕 新发现', ...new Set(rows0.map(r => r.cat))];

const chips = document.getElementById('chips');
function renderChips(){
  chips.innerHTML = '';
  cats.forEach(c => { const b = document.createElement('button');
    b.className = 'chip' + (c === cat ? ' on' : ''); b.textContent = c;
    b.onclick = () => { cat = c; labelF = ''; renderChips(); renderLabels(); draw(); };
    chips.appendChild(b); });
}
const lrow = document.getElementById('lrow'), lchips = document.getElementById('lchips');
function renderLabels(){
  const inCat = cat === '全部' || cat === '🆕 新发现' ? [] :
    [...new Set(rows0.filter(r => r.cat === cat).map(r => r.label))];
  lrow.style.display = inCat.length ? '' : 'none';
  lchips.innerHTML = '';
  ['全部', ...inCat].forEach(l => { const b = document.createElement('button');
    b.className = 'chip' + ((l === '全部' && !labelF) || l === labelF ? ' on' : '');
    b.style.padding = '4px 12px'; b.style.fontSize = '12px'; b.textContent = l;

function draw() {

    t.classList.toggle('asc', t.dataset.k === sortK && asc); });
  let list = rows0.filter(r => (cat === '全部' || (cat === '🆕 新发现' ? r.is_new : r.cat === cat))

    && (!unreadOnly || !isRead(r.name))
    && (!kw || r.name.toLowerCase().includes(kw) || (r.desc || '').toLowerCase().includes(kw) || r.label.includes(kw)));
  list.sort((a, b) => {
    const rd = (isRead(a.name) ? 1 : 0) - (isRead(b.name) ? 1 : 0);   // 已读沉底
    if (rd) return rd;
    const x = a[sortK], y = b[sortK];
    return (typeof x === 'string' ? x.localeCompare(y) : (x ?? -1) - (y ?? -1)) * (asc ? 1 : -1); });
  const sparkSvg = r => {
    if (!r.spark) return '<span class="dim">—</span>';

    const y0 = +pts[0].split(',')[1], y1 = +pts[pts.length - 1].split(',')[1];
    const cls = y1 < y0 - 0.4 ? 'spark-up' : y1 > y0 + 0.4 ? 'spark-down' : 'spark-flat';
    return `<svg class="spark-svg ${cls}" viewBox="0 0 64 18" preserveAspectRatio="none"><polyline points="${r.spark}"/></svg>`;
  };
  const fmt = v => (v === null || v === undefined)
    ? '<span class="dim" title="历史样本积累中, 日涨需24h、周涨需7天">—</span>'

    <td class="num h-spark">${sparkSvg(r)}</td>

    <td class="num d7">${fmt(r.d7d)}</td>
    <td class="num act dim">${r.pushed_days}天前</td>
    <td class="desc">${r.desc || ''}</td></tr>`).join('')
    : `<tr><td colspan="10" style="text-align:center;padding:32px;color:var(--dim)">没有匹配的项目</td></tr>`;
}
renderLabels();
draw();
